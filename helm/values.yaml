replicaCount: 3

image:
  repository: new-tes
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: new-tes.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  NODE_ENV: production
  PORT: '3000'
  DATABASE_URI: mongodb://mongo-service:27017/new-tes
  REDIS_URL: redis://redis-service:6379

secrets:
  JWT_SECRET: your-super-secret-jwt-key-change-in-production
