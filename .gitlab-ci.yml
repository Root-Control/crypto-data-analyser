stages:
  - build
  - test
  - deploy

variables:
  NODE_VERSION: '18'
  DOCKER_IMAGE: 'new-tes'
  DOCKER_TAG: '$CI_COMMIT_SHORT_SHA'

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  before_script:
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - mongo:7.0
    - redis:7.2-alpine
  before_script:
    - npm ci
  script:
    - npm run test
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$DOCKER_TAG .
    - docker push $CI_REGISTRY_IMAGE:$DOCKER_TAG
  only:
    - main
    - develop

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to production..."
    - curl -X POST $DEPLOY_WEBHOOK_URL
  only:
    - main
  when: manual
